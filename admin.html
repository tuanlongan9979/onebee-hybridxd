<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Đăng ký tư vấn · OneBee HybridXD</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{--paper:#F4F6F9;--card:#fff;--ink:#132030;--ink-2:#4A586B;--line:#D3DBE5;--lark:#1F5BD8;--lark-soft:#E3ECFD;--tech:#E0610F;--tech-soft:#FDEBDC;--ok:#137A47;--ok-soft:#DDF3E7;--bad:#C2321F;
  --f:"Be Vietnam Pro",system-ui,"Segoe UI",sans-serif;--m:"JetBrains Mono",Consolas,monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:400 15px/1.5 var(--f)}
.wrap{max-width:1280px;margin:0 auto;padding:24px 20px 48px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:20px}
h1{font-size:22px;margin:0;font-weight:800}
h1 small{display:block;font-size:13px;color:var(--ink-2);font-weight:500}
.btn{min-height:42px;padding:0 16px;border-radius:9px;border:1.5px solid var(--line);background:var(--card);font:600 14px var(--f);cursor:pointer;color:var(--ink)}
.btn.p{background:var(--lark);color:#fff;border-color:var(--lark)}
.login{max-width:380px;margin:12vh auto;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:28px;display:grid;gap:12px}
.login input,select{min-height:44px;padding:0 12px;border-radius:9px;border:1.5px solid var(--line);font:400 15px var(--f);width:100%;background:var(--card);color:var(--ink)}
.err{color:var(--bad);font-size:14px;min-height:1em}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;text-align:left;font:inherit;color:inherit}
.stat[aria-pressed=true]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.stat b{display:block;font:800 26px var(--f);font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--ink-2)}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.bar select{width:auto;min-width:200px}
.tbl{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse;min-width:1100px;font-size:14px}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:12px;color:var(--ink-2);background:#EEF2F7;position:sticky;top:0}
td.t{font-family:var(--m);font-size:12.5px;white-space:nowrap;color:var(--ink-2)}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.i{background:var(--tech-soft);color:#A9450A}.pill.p{background:var(--lark-soft);color:#1A4FBF}.pill.r{background:var(--ok-soft);color:var(--ok)}
.muted{color:var(--ink-2);font-size:12.5px}
.empty{padding:40px;text-align:center;color:var(--ink-2)}
</style>
</head>
<body>
<div class="wrap">
  <form class="login" id="login">
    <h1>Đăng ký tư vấn<small>OneBee HybridXD · Quản trị</small></h1>
    <label for="key">Mã quản trị</label>
    <input id="key" type="password" autocomplete="current-password" required>
    <div class="err" id="lerr" role="alert"></div>
    <button class="btn p" type="submit">Xem danh sách</button>
  </form>

  <div id="app" hidden>
    <header>
      <h1>Đăng ký tư vấn<small id="sub"></small></h1>
      <div style="display:flex;gap:8px">
        <button class="btn" id="reload">Tải lại</button>
        <button class="btn p" id="csv">Xuất Excel (CSV)</button>
      </div>
    </header>
    <div class="stats" id="stats"></div>
    <div class="bar">
      <select id="f-req" aria-label="Lọc theo nhu cầu"><option value="">Mọi nhu cầu</option></select>
      <select id="f-pkg" aria-label="Lọc theo gói"><option value="">Mọi gói</option></select>
      <span class="muted" id="shown"></span>
    </div>
    <div class="tbl"><table>
      <thead><tr><th>Thời gian</th><th>Khách hàng</th><th>Vai trò</th><th>Giải pháp quan tâm</th><th>Gói</th><th>Nhu cầu</th><th>Đã xem / Ghi chú</th><th>Nguồn</th></tr></thead>
      <tbody id="rows"></tbody>
    </table></div>
  </div>
</div>
<script>
(function(){
  const INTERESTS=['Quản lý dự án','Dự toán & Dự thầu','Thẩm tra thiết kế','Thanh quyết toán','Kiểm thử & Nghiệm thu','Hồ sơ & Cấp phép','Chưa xác định'];
  let key='', leads=[], fInterest='';
  try{ key=sessionStorage.getItem('hx-admin')||''; }catch(_){}
  const $=id=>document.getElementById(id);
  const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const time=iso=>new Date(iso).toLocaleString('vi-VN',{timeZone:'Asia/Ho_Chi_Minh',hour12:false});

  async function load(){
    const r=await fetch('/api/leads',{headers:{'x-admin-key':key}});
    const j=await r.json().catch(()=>({}));
    if(r.status===401) throw new Error('Sai mã quản trị.');
    if(!r.ok||!j.ok) throw new Error(j.error||'Không tải được dữ liệu.');
    leads=j.leads; render();
  }
  function filtered(){
    return leads.filter(l=>(!fInterest||l.interest===fInterest)&&(!$('f-req').value||l.request===$('f-req').value)&&(!$('f-pkg').value||l.package===$('f-pkg').value));
  }
  function fillSel(sel,vals,first){ const cur=sel.value; sel.innerHTML=`<option value="">${first}</option>`+vals.map(v=>`<option>${esc(v)}</option>`).join(''); sel.value=vals.includes(cur)?cur:''; }
  function render(){
    $('sub').textContent=`${leads.length} đăng ký · cập nhật ${new Date().toLocaleTimeString('vi-VN',{hour12:false})}`;
    const cnt=v=>leads.filter(l=>l.interest===v).length;
    $('stats').innerHTML=`<button class="stat" data-i="" aria-pressed="${!fInterest}"><b>${leads.length}</b><span>Tất cả</span></button>`+
      INTERESTS.map(v=>`<button class="stat" data-i="${esc(v)}" aria-pressed="${fInterest===v}"><b>${cnt(v)}</b><span>${esc(v)}</span></button>`).join('');
    fillSel($('f-req'),[...new Set(leads.map(l=>l.request))],'Mọi nhu cầu');
    fillSel($('f-pkg'),[...new Set(leads.map(l=>l.package))],'Mọi gói');
    const rows=filtered();
    $('shown').textContent=`Đang hiện ${rows.length}`;
    $('rows').innerHTML=rows.length?rows.map(l=>`<tr>
      <td class="t">${esc(time(l.createdAt))}</td>
      <td><b>${esc(l.name)}</b><br><span style="font-family:var(--m)">${esc(l.phone)}</span><br><span class="muted">${esc(l.company)}</span></td>
      <td>${esc(l.role)}</td>
      <td><span class="pill i">${esc(l.interest)}</span></td>
      <td>${l.package&&l.package!=='Chưa chọn'?`<span class="pill p">${esc(l.package)}</span>`:'<span class="muted">—</span>'}</td>
      <td><span class="pill r">${esc(l.request)}</span></td>
      <td class="muted">${esc((l.viewed||[]).join(', ')||'—')}${l.note?`<br>${esc(l.note)}`:''}</td>
      <td class="muted">${esc(l.source)}</td></tr>`).join(''):`<tr><td colspan="8" class="empty">Chưa có đăng ký nào.</td></tr>`;
  }
  function csv(){
    const head=['Thời gian','Họ và tên','Số điện thoại','Tên công ty','Vai trò','Giải pháp quan tâm','Gói quan tâm','Nhu cầu','Giải pháp đã xem','Ghi chú','Nguồn đăng ký'];
    const q=v=>`"${String(v??'').replace(/"/g,'""')}"`;
    const lines=[head.map(q).join(',')].concat(filtered().map(l=>[time(l.createdAt),l.name,"'"+l.phone,l.company,l.role,l.interest,l.package,l.request,(l.viewed||[]).join(', '),l.note,l.source].map(q).join(',')));
    const url=URL.createObjectURL(new Blob(['﻿'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'}));
    const a=Object.assign(document.createElement('a'),{href:url,download:`dang-ky-tu-van-${new Date().toISOString().slice(0,10)}.csv`});
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),1000);
  }
  async function enter(){
    try{ await load(); $('login').hidden=true; $('app').hidden=false; try{sessionStorage.setItem('hx-admin',key)}catch(_){} }
    catch(e){ $('lerr').textContent=e.message; try{sessionStorage.removeItem('hx-admin')}catch(_){} }
  }
  $('login').addEventListener('submit',e=>{e.preventDefault(); key=$('key').value.trim(); $('lerr').textContent=''; enter();});
  $('stats').addEventListener('click',e=>{const b=e.target.closest('.stat'); if(b){fInterest=b.dataset.i; render();}});
  $('f-req').addEventListener('change',render); $('f-pkg').addEventListener('change',render);
  $('reload').addEventListener('click',()=>load().catch(e=>{$('sub').textContent=e.message;}));
  $('csv').addEventListener('click',csv);
  if(key) enter();
})();
</script>
</body>
</html>
